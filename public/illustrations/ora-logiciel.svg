<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Éleveur qui suit son poulailler sur son téléphone</title>
  <desc id="d">Un éleveur debout devant un poulailler en tôle, avec un plateau d'œufs et un sac d'aliment, consulte le suivi de ponte sur son téléphone.</desc>
  <defs>
    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1a1a1a" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#1a1a1a" stop-opacity=".35"/>
      <stop offset="0.88" stop-color="#1a1a1a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1a1a1a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H10M0 0V10" stroke="#1a1a1a" stroke-opacity=".16" stroke-width=".8" fill="none"/>
    </pattern>
    <g id="hen" stroke-width="1.2">
      <path d="M7 17 C-2 15 -3 5 1 0 C4 5 9 7 13 11 Z" fill="#e4e5e2"/>
      <ellipse cx="20" cy="20" rx="15" ry="11" fill="#fff"/>
      <path d="M11 19 Q20 13 29 19 Q20 27 11 19 Z" fill="#e4e5e2"/>
      <path d="M30 14 L34 12" fill="none"/>
      <circle cx="36" cy="8" r="5" fill="#fff"/>
      <path d="M33 4 Q34 -1 36 2 Q38 -1 39 3" fill="#e4e5e2"/>
      <path d="M41 7 L46 9 L41 11 Z" fill="#e4e5e2"/>
      <path d="M16 31 V38 M24 31 V38 M13 38 H19 M21 38 H27" fill="none"/>
    </g>
  </defs>

  <g fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Palmier à droite, derrière l'éleveur -->
    <g>
      <path d="M646 332 C642 270 652 200 646 126" stroke-width="9"/>
      <path d="M646 332 C642 270 652 200 646 126" stroke="#e4e5e2" stroke-width="6.5"/>
      <path d="M646 126 C629 104 605 106 589 126 C609 117 629 118 646 126 Z" fill="#e4e5e2"/>
      <path d="M646 126 C663 104 687 106 700 124 C684 117 663 118 646 126 Z" fill="#e4e5e2"/>
      <path d="M646 126 C633 108 621 88 625 70 C637 84 643 102 646 126 Z" fill="#e4e5e2"/>
      <path d="M646 126 C659 108 671 88 667 70 C655 84 649 102 646 126 Z" fill="#e4e5e2"/>
      <path d="M646 126 C621 122 599 138 593 160 C613 142 631 134 646 126 Z" fill="#e4e5e2"/>
      <path d="M646 126 C671 122 693 138 699 160 C679 142 661 134 646 126 Z" fill="#e4e5e2"/>
    </g>

    <!-- Poules dans le poulailler -->
    <use href="#hen" transform="translate(70 252) scale(1.25)"/>
    <use href="#hen" transform="translate(178 256) scale(1.18)"/>
    <use href="#hen" transform="translate(246 252) scale(1.25)"/>

    <!-- Grillage -->
    <rect x="44" y="190" width="292" height="110" fill="url(#mesh)" stroke="none"/>

    <!-- Muret -->
    <rect x="44" y="300" width="292" height="32" fill="#f4f4f1"/>
    <path d="M117 300V332 M190 300V332 M263 300V332" stroke-opacity=".35"/>

    <!-- Poteaux et poutre -->
    <path d="M44 178V332 M190 176V332 M336 178V332"/>
    <path d="M117 183V300 M263 183V300" stroke-opacity=".45"/>
    <path d="M44 190H336"/>

    <!-- Toit en tôle -->
    <path d="M28 172 L190 116 L352 172 L346 180 L190 128 L34 180 Z" fill="#e4e5e2"/>
    <path d="M190 128 L190 176" stroke="none"/>

    <!-- Sac de provende -->
    <path d="M306 332 L299 286 Q298 272 310 266 L318 258 L346 258 L354 266 Q366 272 365 286 L358 332 Z" fill="#f4f4f1"/>
    <path d="M318 258 Q332 266 346 258"/>
    <path d="M316 270 H348" stroke-opacity=".5"/>
    <rect x="319" y="288" width="26" height="20" rx="2" stroke-opacity=".5"/>
    <path d="M324 296H340 M324 301H336" stroke-opacity=".5"/>

    <!-- Caisse et plateau d'œufs -->
    <rect x="384" y="290" width="120" height="42" fill="#e4e5e2"/>
    <path d="M384 305H504 M384 318H504" stroke-opacity=".4"/>
    <path d="M380 290 L508 290 L494 268 L394 268 Z" fill="#fff"/>
    <g fill="#ebc77a">
      <ellipse cx="410" cy="272" rx="6.5" ry="8"/>
      <ellipse cx="430" cy="272" rx="6.5" ry="8"/>
      <ellipse cx="450" cy="272" rx="6.5" ry="8"/>
      <ellipse cx="470" cy="272" rx="6.5" ry="8"/>
      <ellipse cx="400" cy="281" rx="6.5" ry="8"/>
      <ellipse cx="420" cy="281" rx="6.5" ry="8"/>
      <ellipse cx="440" cy="281" rx="6.5" ry="8"/>
      <ellipse cx="460" cy="281" rx="6.5" ry="8"/>
      <ellipse cx="480" cy="281" rx="6.5" ry="8"/>
    </g>
    <path d="M380 290 H508" stroke-width="2"/>

    <!-- Éleveur (échelle réduite, pieds ancrés au sol) -->
    <g transform="translate(560 332) scale(.86) translate(-546 -332)">
      <path d="M531 244 L531 318" stroke-width="22"/>
      <path d="M531 244 L531 318" stroke="#d6d8d5" stroke-width="19"/>
      <path d="M562 244 L563 318" stroke-width="22"/>
      <path d="M562 244 L563 318" stroke="#d6d8d5" stroke-width="19"/>
      <path d="M520 318 H544 V330 Q544 334 540 334 H516 Q514 328 520 318 Z" fill="#1a1a1a"/>
      <path d="M551 318 H575 V330 Q575 334 571 334 H547 Q545 328 551 318 Z" fill="#1a1a1a"/>
      <path d="M574 168 L585 222" stroke-width="16"/>
      <path d="M574 168 L585 222" stroke="#e4e5e2" stroke-width="13"/>
      <path d="M519 158 Q546 148 574 158 L578 240 L516 240 Z" fill="#e4e5e2"/>
      <path d="M516 238 H578" stroke-width="5"/>
      <path d="M552 160 V236" stroke-opacity=".35"/>
      <path d="M526 186 H540 V200 H526 Z" stroke-opacity=".5"/>
      <circle cx="585" cy="228" r="6" fill="#fff"/>
      <path d="M541 146 V153 M552 146 V153"/>
      <circle cx="546" cy="130" r="17" fill="#fff"/>
      <path d="M529 126 Q530 108 547 108 Q563 108 563 124 Z" fill="#e4e5e2"/>
      <path d="M529 126 L511 129" stroke-width="2"/>
      <path d="M524 166 L504 206" stroke-width="16"/>
      <path d="M524 166 L504 206" stroke="#e4e5e2" stroke-width="13"/>
      <path d="M504 206 L486 178" stroke-width="14"/>
      <path d="M504 206 L486 178" stroke="#e4e5e2" stroke-width="11"/>
      <g transform="rotate(-14 478 166)">
        <rect x="466" y="146" width="24" height="40" rx="4" fill="#fff"/>
        <rect x="470" y="152" width="16" height="26" rx="1.5" fill="#f4f4f1" stroke-width="1"/>
        <path d="M472 173 L475 168 L478 170 L481 162 L484 164" stroke="#c1881c" stroke-width="1.6"/>
        <path d="M472 157H480" stroke-width="1" stroke-opacity=".5"/>
      </g>
      <circle cx="488" cy="177" r="6" fill="#fff"/>
    </g>

    <!-- Lien téléphone vers plateau -->
    <path d="M522 196 C486 196 458 220 440 256" stroke="#c1881c" stroke-width="1.4" stroke-dasharray="2 5"/>
  </g>

  <!-- Sol -->
  <path d="M10 332H720" stroke="url(#ground)" stroke-width="1.5" fill="none"/>
</svg>
